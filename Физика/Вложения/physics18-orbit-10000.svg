<svg xmlns="http://www.w3.org/2000/svg" width="520" height="330" viewBox="0 0 520 330" font-family="Arial,sans-serif">
<title>Круговая орбита: радиус от центра Земли и скорость по касательной</title>
<desc>Спутник справа от Земли. Скорость вверх, тяготение и ускорение влево к центру.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="context-stroke"/></marker></defs>
<rect width="520" height="330" rx="12" fill="#f8fafc"/>
<circle cx="222" cy="166" r="138" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5"/>
<circle cx="222" cy="166" r="88" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<path d="M222 166H360" stroke="#475569" stroke-width="2" stroke-dasharray="5 4"/>
<circle cx="222" cy="166" r="4" fill="#0f172a"/><text x="207" y="152" font-size="17">O</text>
<text x="222" y="213" text-anchor="middle" fill="#1e3a8a" font-size="18">Земля</text>
<text x="286" y="192" text-anchor="middle" fill="#0f172a" font-size="16">r = 10 000 км</text>
<path d="M360 160V72" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arrow)"/>
<text x="373" y="80" fill="#1d4ed8" font-size="19">v</text>
<path d="M354 161L290 161" stroke="#a21caf" stroke-width="3" marker-end="url(#arrow)"/>
<text x="286" y="144" fill="#86198f" font-size="16">Fₜ, a</text>
<circle cx="360" cy="166" r="7" fill="#0f172a"/><text x="375" y="172" fill="#0f172a" font-size="16">Спутник</text>
<text x="377" y="230" fill="#475569" font-size="16">Круговая орбита</text>
</svg>